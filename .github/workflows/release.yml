name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match vX.Y.Z"
            exit 1
          fi

  build-release:
    name: Release Binary
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p dreamstack --release
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Verify binary
        run: file target/release/dreamstack | grep -q "stripped"

      - name: Package binary
        run: |
          mkdir -p dist/release
          cp target/release/dreamstack dist/release/dreamstack-linux-x86_64
          tar -C dist/release -czf dist/dreamstack-linux-x86_64.tar.gz dreamstack-linux-x86_64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamstack-linux-x86_64
          path: dist/dreamstack-linux-x86_64.tar.gz
          if-no-files-found: error

  build-release-with-debug:
    name: Release Binary with Debug Info
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary with debug info
        run: cargo build -p dreamstack --release
        env:
          CARGO_PROFILE_RELEASE_DEBUG: full
          CARGO_PROFILE_RELEASE_STRIP: none

      - name: Verify binary
        run: readelf -S target/release/dreamstack | grep -q "\.debug_info"

      - name: Package binary
        run: |
          mkdir -p dist/release-with-debug
          cp target/release/dreamstack dist/release-with-debug/dreamstack-linux-x86_64-debug
          tar -C dist/release-with-debug -czf dist/dreamstack-linux-x86_64-debug.tar.gz dreamstack-linux-x86_64-debug

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamstack-linux-x86_64-debug
          path: dist/dreamstack-linux-x86_64-debug.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-release
      - build-release-with-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          awk '
            /^## / {
              if (section) {
                exit
              }
              section = 1
            }
            section { print }
          ' CHANGELOG.md > release-notes.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dreamstack-linux-x86_64.tar.gz
            dist/dreamstack-linux-x86_64-debug.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
