name: Dev Release

on:
  push:
    tags:
      - "[0-9][0-9]w[0-9][0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9]w[0-9][0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-)?[0-9]{2}w[0-9]{2}[A-Za-z0-9._-]*$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match vX.Y.Z-YYwWW[build-id] or YYwWW[build-id]"
            exit 1
          fi

  build-release:
    name: Release Binary
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: dreamstack-linux-x86_64
            binary-path: target/release/dreamstack
            packaged-binary: dreamstack-linux-x86_64
            archive-path: dist/dreamstack-linux-x86_64.tar.gz
            strip-check: file target/release/dreamstack | grep -q "stripped"
          - os: windows-latest
            artifact-name: dreamstack-windows-x86_64
            binary-path: target/release/dreamstack.exe
            packaged-binary: dreamstack-windows-x86_64.exe
            archive-path: dist/dreamstack-windows-x86_64.zip
            strip-check: ""
          - os: macos-13
            artifact-name: dreamstack-macos-x86_64
            binary-path: target/release/dreamstack
            packaged-binary: dreamstack-macos-x86_64
            archive-path: dist/dreamstack-macos-x86_64.tar.gz
            strip-check: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p dreamstack --release
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Verify binary
        if: matrix.strip-check != ''
        run: ${{ matrix.strip-check }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/release
          cp ${{ matrix.binary-path }} dist/release/${{ matrix.packaged-binary }}
          tar -C dist/release -czf ${{ matrix.archive-path }} ${{ matrix.packaged-binary }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release
          Copy-Item ${{ matrix.binary-path }} dist/release/${{ matrix.packaged-binary }}
          Compress-Archive -Path dist/release/${{ matrix.packaged-binary }} -DestinationPath ${{ matrix.archive-path }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.archive-path }}
          if-no-files-found: error

  build-release-with-debug:
    name: Release Binary with Debug Info
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary with debug info
        run: cargo build -p dreamstack --release
        env:
          CARGO_PROFILE_RELEASE_DEBUG: full
          CARGO_PROFILE_RELEASE_STRIP: none

      - name: Verify binary
        run: readelf -S target/release/dreamstack | grep -q "\.debug_info"

      - name: Package binary
        run: |
          mkdir -p dist/release-with-debug
          cp target/release/dreamstack dist/release-with-debug/dreamstack-linux-x86_64-debug
          tar -C dist/release-with-debug -czf dist/dreamstack-linux-x86_64-debug.tar.gz dreamstack-linux-x86_64-debug

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamstack-linux-x86_64-debug
          path: dist/dreamstack-linux-x86_64-debug.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-release
      - build-release-with-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          awk '
            /^## / {
              if (section) {
                exit
              }
              section = 1
            }
            section { print }
          ' CHANGELOG.md > release-notes.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dreamstack-linux-x86_64.tar.gz
            dist/dreamstack-windows-x86_64.zip
            dist/dreamstack-macos-x86_64.tar.gz
            dist/dreamstack-linux-x86_64-debug.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
