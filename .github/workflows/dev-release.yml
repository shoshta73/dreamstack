name: Dev Release

on:
  push:
    tags:
      - "[0-9][0-9]w[0-9][0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9]w[0-9][0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-)?[0-9]{2}w[0-9]{2}[A-Za-z0-9._-]*$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match vX.Y.Z-YYwWW[build-id] or YYwWW[build-id]"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          awk '
            /^## / {
              if (section) {
                exit
              }
              section = 1
            }
            section { print }
          ' CHANGELOG.md > release-notes.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p dreamstack --release
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Build release binary with debug info
        run: cargo build -p dreamstack --release --target-dir target/release-with-debug
        env:
          CARGO_PROFILE_RELEASE_DEBUG: full
          CARGO_PROFILE_RELEASE_STRIP: none

      - name: Verify binaries
        run: |
          file target/release/dreamstack | grep -q "stripped"
          readelf -S target/release-with-debug/release/dreamstack | grep -q "\.debug_info"

      - name: Package binaries
        run: |
          mkdir -p dist/release dist/release-with-debug
          cp target/release/dreamstack dist/release/dreamstack-linux-x86_64
          cp target/release-with-debug/release/dreamstack dist/release-with-debug/dreamstack-linux-x86_64-debug
          tar -C dist/release -czf dist/dreamstack-linux-x86_64.tar.gz dreamstack-linux-x86_64
          tar -C dist/release-with-debug -czf dist/dreamstack-linux-x86_64-debug.tar.gz dreamstack-linux-x86_64-debug

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dreamstack-linux-x86_64.tar.gz
            dist/dreamstack-linux-x86_64-debug.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
