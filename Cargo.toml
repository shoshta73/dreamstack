[package]
name = "dreamstack"
version = "0.0.0"
edition = "2024"

[dependencies]
eframe = {
  version = "0.34.3",
  default-features = false,
  features = ["default_fonts", "glow", "wayland", "x11"]
}
egui = "0.34.3"
mlua = { version = "0.11.6", features = ["lua55"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.47.2"
test-case = "3.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = {
  version = "0.3.83",
  features = ["Document", "HtmlCanvasElement", "Storage", "Window"]
}
